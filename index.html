<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090d" />
  <title>Stream PWA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
</head>
<body>

  <!-- ================= TELA DE LOGIN / CONEXÃO DE LISTAS ================= -->
  <section id="login-screen" class="screen active">
    <div class="login-container">
      <div class="brand-header" id="login-brand"></div>
      <p class="brand-subtitle" id="login-tagline"></p>

      <!-- Abas dos formatos suportados -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-type="xtream">Xtream Codes</button>
        <button type="button" class="tab-btn" data-type="m3u">M3U / M3U8</button>
        <button type="button" class="tab-btn" data-type="json">Lista JSON</button>
        <button type="button" class="tab-btn" data-type="url">URL Direta</button>
      </div>

      <!-- Formulário com Rótulos Flutuantes na Borda -->
      <form id="connection-form" class="auth-form">
        <div class="floating-group">
          <input type="text" id="profile-name" placeholder=" " required />
          <label for="profile-name">Nome da Lista (Ex: Minha TV)</label>
        </div>

        <!-- Campos Xtream Codes -->
        <div id="fields-xtream" class="type-fields">
          <div class="floating-group">
            <input type="url" id="xtream-host" placeholder=" " />
            <label for="xtream-host">Servidor / DNS (http://...)</label>
          </div>
          <div class="input-row">
            <div class="floating-group">
              <input type="text" id="xtream-user" placeholder=" " autocapitalize="none" />
              <label for="xtream-user">Usuário</label>
            </div>
            <div class="floating-group">
              <input type="password" id="xtream-pass" placeholder=" " />
              <label for="xtream-pass">Senha</label>
            </div>
          </div>
        </div>

        <!-- Campos M3U / M3U8 -->
        <div id="fields-m3u" class="type-fields hidden">
          <div class="floating-group">
            <input type="url" id="m3u-url" placeholder=" " />
            <label for="m3u-url">Link da Lista M3U ou M3U8</label>
          </div>
          <div class="file-box">
            <span class="file-box-label">Ou carregue um arquivo local (.m3u / .m3u8)</span>
            <input type="file" id="m3u-file" accept=".m3u,.m3u8,text/plain" />
          </div>
        </div>

        <!-- Campos JSON -->
        <div id="fields-json" class="type-fields hidden">
          <div class="floating-group">
            <input type="url" id="json-url" placeholder=" " />
            <label for="json-url">URL do Arquivo JSON</label>
          </div>
          <div class="floating-group">
            <textarea id="json-raw" rows="3" placeholder=" "></textarea>
            <label for="json-raw">Ou cole o conteúdo JSON aqui</label>
          </div>
        </div>

        <!-- Campos URL Direta -->
        <div id="fields-url" class="type-fields hidden">
          <div class="floating-group">
            <input type="url" id="direct-url" placeholder=" " />
            <label for="direct-url">URL do Stream (.m3u8, .mp4, .mkv)</label>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-connect">
          Conectar e Carregar Catálogo
        </button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>

      <!-- Listas Salvas anteriormente -->
      <div id="saved-profiles-box" class="saved-profiles hidden">
        <h3>Listas Salvas</h3>
        <div id="saved-profiles-list" class="profiles-grid"></div>
      </div>
    </div>
  </section>

  <!-- ================= TELA PRINCIPAL DO APLICATIVO ================= -->
  <section id="app-screen" class="screen hidden">
    
    <!-- Barra Superior -->
    <header class="top-bar">
      <div class="top-left">
        <div class="brand-mini" id="app-brand"></div>
      </div>

      <div class="top-center">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" placeholder="Buscar canal, filme ou série..." />
        </div>
      </div>

      <div class="top-right">
        <button id="btn-switch-list" class="btn-ghost" title="Trocar Lista">
          ⇄ <span class="hide-mobile">Listas</span>
        </button>
      </div>
    </header>

    <!-- Navegação Principal -->
    <nav class="main-nav">
      <button class="nav-item active" data-section="home">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Início</span>
      </button>
      <button class="nav-item" data-section="live">
        <span class="nav-icon">📺</span>
        <span class="nav-label">TV ao Vivo</span>
      </button>
      <button class="nav-item" data-section="movies">
        <span class="nav-icon">🎬</span>
        <span class="nav-label">Filmes</span>
      </button>
      <button class="nav-item" data-section="series">
        <span class="nav-icon">🎞️</span>
        <span class="nav-label">Séries</span>
      </button>
      <button class="nav-item" data-section="favorites">
        <span class="nav-icon">★</span>
        <span class="nav-label">Minha Lista</span>
      </button>
    </nav>

    <!-- Conteúdo Rolável -->
    <main class="main-content" id="main-content">
      
      <!-- Banner Destaque -->
      <div id="hero-banner" class="hero-banner hidden">
        <div class="hero-backdrop" id="hero-backdrop"></div>
        <div class="hero-gradient"></div>
        <div class="hero-info">
          <span class="hero-badge" id="hero-badge">EM DESTAQUE</span>
          <h1 id="hero-title">Título em Destaque</h1>
          <p id="hero-desc">Toque para iniciar a reprodução.</p>
          <div class="hero-actions">
            <button id="hero-play-btn" class="btn-primary">▶ Assistir</button>
            <button id="hero-info-btn" class="btn-secondary">ⓘ Sobre</button>
          </div>
        </div>
      </div>

      <!-- Barra de Categorias em Português -->
      <div id="category-bar" class="category-bar hidden"></div>

      <!-- Seção de Carrosséis Horizontais (Início e TV ao Vivo por Categoria) -->
      <div id="home-rows" class="rows-container"></div>

      <!-- Grade de Itens (Quando filtra uma categoria específica, VODs ou Busca) -->
      <div id="catalog-grid-wrapper" class="hidden">
        <div class="section-header">
          <h2 id="section-title">Catálogo</h2>
          <span id="section-count" class="count-badge">0 itens</span>
        </div>
        <div id="catalog-grid" class="media-grid"></div>
        <div id="scroll-sentinel" class="scroll-sentinel"></div>
      </div>
    </main>
  </section>

  <!-- ================= TELA "SOBRE" (DETALHES DE FILME / SÉRIE / CANAL) ================= -->
  <div id="vod-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="btn-close-modal" class="modal-close" aria-label="Fechar">✕</button>
      
      <div class="modal-hero">
        <img id="modal-backdrop" src="" alt="" />
        <div class="modal-hero-gradient"></div>
      </div>

      <div class="modal-body">
        <div class="modal-header-flex">
          <img id="modal-poster" class="modal-poster" src="" alt="" />
          <div class="modal-title-area">
            <span id="modal-category" class="badge-pill">Categoria</span>
            <h2 id="modal-title">Nome do Conteúdo</h2>
            <div class="modal-meta">
              <span id="modal-year"></span>
              <span id="modal-rating" class="rating-tag"></span>
              <span id="modal-duration"></span>
            </div>
          </div>
        </div>

        <!-- Barra de progresso -->
        <div id="modal-progress-box" class="modal-progress-box hidden">
          <div class="progress-track">
            <div id="modal-progress-fill" class="progress-fill"></div>
          </div>
          <span id="modal-progress-text" class="progress-label"></span>
        </div>

        <!-- Botões de Ação -->
        <div class="modal-actions">
          <button id="btn-resume" class="btn-primary hidden">
            ▶ Continuar de <span id="resume-time-label">00:00</span>
          </button>
          <button id="btn-play-start" class="btn-primary">
            ▶ Assistir do início
          </button>
          <button id="btn-toggle-fav" class="btn-secondary">
            + Minha Lista
          </button>
        </div>

        <!-- Sinopse e Detalhes -->
        <p id="modal-synopsis" class="modal-synopsis"></p>
        <div id="modal-extra-info" class="modal-extra"></div>

        <!-- Seletor de Temporadas e Episódios -->
        <div id="series-episodes-box" class="series-box hidden">
          <div class="series-header">
            <h3>Episódios</h3>
            <select id="season-select" class="season-select"></select>
          </div>
          <div id="episodes-list" class="episodes-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PLAYER DE VÍDEO FULLSCREEN ================= -->
  <div id="player-overlay" class="player-overlay hidden">
    <div class="player-top-controls">
      <button id="btn-close-player" class="btn-player-ctrl">← Voltar</button>
      <div class="player-title-box">
        <h4 id="player-title">Reproduzindo</h4>
        <span id="player-subtitle"></span>
      </div>
      <div class="player-right-ctrls">
        <button id="btn-restart-video" class="btn-player-ctrl" title="Recomeçar">↺ Início</button>
        <button id="btn-pip" class="btn-player-ctrl" title="Picture-in-Picture">⧉ PiP</button>
      </div>
    </div>

    <video id="video-player" controls playsinline webkit-playsinline autoplay></video>
    <div id="player-spinner" class="player-spinner hidden">Carregando stream...</div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
